<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Log In | StudySpace</title>

    <link rel="stylesheet" href="../css/theme.css" />
    <link rel="stylesheet" href="../css/auth.css" />

    <script src="https://unpkg.com/lucide@latest" defer></script>
    <script src="../js/theme.js" defer></script>
  </head>

  <body class="auth-page">
    <header class="auth-header">
      <a href="index.html" class="logo">
        <i data-lucide="graduation-cap"></i>
        <span>StudySpace</span>
      </a>

      <button
        class="theme-switch"
        id="themeToggle"
        type="button"
        aria-label="Toggle dark mode"
        aria-pressed="false"
      >
        <span class="switch-icon sun">
          <i data-lucide="sun"></i>
        </span>

        <span class="switch-icon moon">
          <i data-lucide="moon"></i>
        </span>

        <span class="theme-switch-thumb"></span>
      </button>
    </header>

    <main class="auth-container">
      <section class="auth-card">
        <div class="auth-heading">
          <div class="auth-icon">
            <i data-lucide="graduation-cap"></i>
          </div>

          <h1>Welcome back</h1>
          <p>Log in to continue organizing your academic life.</p>
        </div>

        <form id="loginForm">
          <div class="form-group">
            <label for="email">Email address</label>

            <div class="input-wrapper">
              <i data-lucide="mail"></i>
              <input
                type="email"
                id="email"
                placeholder="Enter your email"
                required
              />
            </div>
          </div>

          <div class="form-group">
            <div class="password-label">
              <label for="password">Password</label>
              <a href="#" class="forgot-link">Forgot password?</a>
            </div>

            <div class="input-wrapper">
              <i data-lucide="lock"></i>
              <input
                type="password"
                id="password"
                placeholder="Enter your password"
                required
              />
            </div>
          </div>

          <button type="submit" class="auth-button">
            Log In
            <i data-lucide="arrow-right"></i>
          </button>
        </form>

        <div class="auth-divider">
          <span>New to StudySpace?</span>
        </div>

        <p class="auth-footer">
          Don't have an account?
          <a href="register.html">Create one</a>
        </p>
      </section>

      <div class="back-home">
        <a href="index.html" class="return-home">
          <i data-lucide="arrow-left"></i>
          Back to Home
        </a>
      </div>
    </main>

    <script>
      document.addEventListener("DOMContentLoaded", () => {
        if (window.lucide) {
          window.lucide.createIcons();
        }
      });
    </script>
  </body>
</html>
